name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Prepare bundled Node runtime
        shell: powershell
        run: ./scripts/prepare-windows-node.ps1

      - name: Build NSIS installer
        run: npm run tauri -- build --bundles nsis

      - name: Smoke-test Windows MCP runtime
        shell: pwsh
        run: |
          $node = (Resolve-Path "src-tauri/resources/windows/node.exe").Path
          $script = (Resolve-Path "src-tauri/resources/meta-manager-mcp.cjs").Path
          & $node --version
          $child = Start-Process -FilePath $node -ArgumentList @("--no-warnings", "`"$script`"") -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 250
              try {
                $result = Invoke-RestMethod -Uri "http://127.0.0.1:38939/health" -TimeoutSec 2
                if ($result.ok -eq $true) { $ready = $true; break }
              } catch {}
              if ($child.HasExited) { break }
            }
            if (-not $ready) { throw "Bundled Meta Manager MCP service failed Windows health smoke test" }
            Write-Host "Bundled Windows MCP service health OK"
          } finally {
            if (-not $child.HasExited) { Stop-Process -Id $child.Id -Force }
          }

      - name: Smoke-test packaged Windows desktop startup
        shell: pwsh
        run: |
          $unpacker = Join-Path $env:ProgramFiles "7-Zip\7z.exe"
          if (-not (Test-Path $unpacker)) { throw "Windows runner is missing 7-Zip" }
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer is missing" }
          $dest = Join-Path $env:RUNNER_TEMP "meta-manager-smoketest"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          & $unpacker x -y $installer.FullName "-o$dest" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not unpack Windows installer" }
          $appExe = Join-Path $dest "meta-manager.exe"
          if (-not (Test-Path $appExe)) { throw "Installer does not contain meta-manager.exe" }
          if (-not (Test-Path (Join-Path $dest "resources/windows/node.exe"))) {
            throw "Installer does not contain bundled Node runtime"
          }
          if (-not (Test-Path (Join-Path $dest "resources/meta-manager-mcp.cjs"))) {
            throw "Installer does not contain MCP service script"
          }
          $app = Start-Process -FilePath $appExe -WorkingDirectory $dest -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:38939/health" -TimeoutSec 2
                if ($health.ok -and $health.service -eq "meta-manager-mcp") {
                  $ready = $true
                  break
                }
              } catch {}
              if ($app.HasExited) { break }
            }
            if (-not $ready) {
              Write-Host "Packaged executable still running: $(-not $app.HasExited)"
              if ($app.HasExited) { Write-Host "Packaged executable exit code: $($app.ExitCode)" }
              $dataRoot = Join-Path $env:APPDATA "com.advertpreneur.metamanager"
              $mcpLog = Join-Path $dataRoot "meta-manager-mcp.log"
              Write-Host "Windows app-data folder exists: $(Test-Path $dataRoot)"
              Write-Host "MCP startup log exists: $(Test-Path $mcpLog)"
              if (Test-Path $mcpLog) {
                Write-Host "MCP startup log (Windows CI test environment):"
                Get-Content $mcpLog -Tail 30
              }
              throw "Packaged Meta Manager app did not launch its local MCP service"
            }
            Write-Host "Windows desktop integration smoke test OK"
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Meta-Manager-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
  release:
    name: Publish Windows release
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Meta-Manager-Windows-x64
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*-setup.exe